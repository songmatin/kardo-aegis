<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AEGIS</title>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --c1: #111110;
  --c2: #a8a8a4;
  --c3: #003B71;
  --green: #12a150;
  --red:   #e5251a;
  --amber: #d97706;
  --white: #ffffff;
  --surface: #f5f5f3;
  --border: #e4e4e0;
  --sans: 'PT Sans', 'Noto Sans TC', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%; height: 100%;
  background: var(--white);
  font-family: var(--sans);
  overflow: hidden;
  user-select: none;
}

.app {
  width: 100vw; height: 100dvh;
  background: var(--white);
  position: relative;
  border: 3px solid transparent;
  overflow: hidden;
  display: flex; flex-direction: column;
}
.app.flash-border { animation: flash .55s ease-in-out infinite; }
@keyframes flash {
  0%,100% { border-color: rgba(229,37,26,.9); }
  50%      { border-color: rgba(229,37,26,.1); }
}

/* ── STATUS BAR ── */
.bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 12px; height: 28px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.bar-logo { font-weight: 700; font-size: 11px; letter-spacing: .22em; color: var(--c1); text-transform: uppercase; }
.bar-right { display: flex; align-items: center; gap: 7px; }
.gps-pill {
  display: flex; align-items: center; gap: 4px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 2px 8px;
  font-size: 9px; color: var(--c2); letter-spacing: .05em;
}
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: blink 2s ease-in-out infinite; }
.dot.s { background: var(--amber); animation: blink .7s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

/* ── BODY ── */
.body { display: flex; flex: 1; overflow: hidden; min-height: 0; }

/* ── LANDSCAPE (default) ── */
.ls { display: flex; flex: 1; overflow: hidden; min-height: 0; }
.pt { display: none; flex-direction: column; flex: 1; overflow: hidden; min-height: 0; }

/* Auto switch via CSS orientation media query */
@media (orientation: portrait) {
  .ls { display: none; }
  .pt { display: flex; }
}
/* JS override */
.app.is-portrait .ls { display: none !important; }
.app.is-portrait .pt { display: flex !important; }
.app.is-landscape .ls { display: flex !important; }
.app.is-landscape .pt { display: none !important; }

/* ── LANDSCAPE PANELS ── */
.ls-spd {
  flex: 0 0 58%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  border-right: 1px solid var(--border);
  padding: 8px 6px 8px 10px;
  gap: 0;
}

.ls-info {
  flex: 1; display: flex; flex-direction: column;
  padding: 7px 9px 7px 7px; gap: 5px;
  overflow: hidden; min-height: 0;
}
.ls-info > * { flex: 1; min-height: 0; }

/* ── PORTRAIT PANELS ── */
.pt-spd {
  flex: 0 0 50%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  border-bottom: 1px solid var(--border);
  padding: 8px 6px 6px;
  gap: 0;
}
.pt-info {
  flex: 1; display: flex; flex-direction: column;
  padding: 7px 9px; gap: 5px;
  overflow: hidden; min-height: 0;
}
.pt-info > * { flex: 1; min-height: 0; }

/* ── SPEED RING ── */
.ring-wrap {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  container-type: size;
  width: min(54vw, calc(56.25vw - 44px));
  height: min(54vw, calc(56.25vw - 44px));
}
.pt-spd .ring-wrap {
  width: min(80vw, calc(56.25vh - 56px));
  height: min(80vw, calc(56.25vh - 56px));
}

.ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.rg { fill: none; stroke: var(--border); stroke-width: 2.8; }
.rf {
  fill: none; stroke: var(--green); stroke-width: 2.8; stroke-linecap: round;
  stroke-dasharray: 1; stroke-dashoffset: 1;
  transition: stroke-dashoffset .3s ease, stroke .25s ease;
}
.glow {
  position: absolute; inset: 0; border-radius: 50%;
  pointer-events: none; opacity: 0;
  background: radial-gradient(circle, rgba(229,37,26,.06) 0%, transparent 70%);
  transition: opacity .3s;
}
.glow.on { opacity: 1; animation: gpulse 1.1s ease-in-out infinite; }
@keyframes gpulse { 0%,100%{opacity:.5} 50%{opacity:.08} }

.spd-inner {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  width: 72%;
  margin-top: 6cqw;
}
.spd-num {
  font-weight: 700; line-height: .95; color: var(--green);
  font-variant-numeric: tabular-nums; transition: color .2s ease;
  width: 100%; text-align: center; font-size: 47cqw;
}
.spd-num.d3  { font-size: 32cqw; }
.spd-num.red { color: var(--red); }

.spd-unit {
  font-size: 4.8cqw; font-weight: 400;
  color: var(--c2); letter-spacing: .06em; margin-top: 1cqw;
}

/* Speed limit sign — inside ring, below km/h */
.sign {
  margin-top: 2cqw;
  width: 11cqw; height: 11cqw; border-radius: 50%;
  border: 1.8cqw solid var(--red);
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 .3cqw 1.5cqw rgba(0,0,0,.1);
}
.sign-num {
  font-weight: 700; font-size: 3.6cqw; color: var(--c1);
  letter-spacing: -.02em; line-height: 1;
  font-variant-numeric: tabular-nums;
}

/* ── CARDS ── */
.card {
  border: 1px solid var(--border); border-radius: 9px;
  overflow: hidden; background: var(--white);
  display: flex; flex-direction: column;
}

/* Clock */
.clock-card { flex-direction: row; align-items: center; justify-content: space-between; padding: 0 14px; }
.clock-date { font-size: clamp(10px,1.5vh,13px); font-weight: 400; color: var(--c2); }
.clock-time {
  font-weight: 700; font-size: clamp(28px,6.5vh,54px);
  color: var(--c3); letter-spacing: -.03em;
  font-variant-numeric: tabular-nums; line-height: 1;
}

/* Alert */
.alert-card { transition: border-color .3s, box-shadow .3s; }
.alert-card.near  { border-color: var(--amber); box-shadow: 0 0 0 2px rgba(217,119,6,.07); }
.alert-card.close { border-color: var(--red);   box-shadow: 0 0 0 2px rgba(229,37,26,.08); }

.alert-top { flex: 1; display: flex; align-items: center; gap: 9px; padding: 0 12px; min-height: 0; }
.alert-ico {
  width: clamp(26px,3.8vh,36px); height: clamp(26px,3.8vh,36px);
  border-radius: 7px; background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background .3s;
}
.alert-ico.red   { background: rgba(229,37,26,.08); }
.alert-ico.amber { background: rgba(217,119,6,.08); }
.alert-ico svg   { width: 52%; height: 52%; color: var(--c2); transition: color .3s; }
.alert-ico.red   svg { color: var(--red); }
.alert-ico.amber svg { color: var(--amber); }

.alert-meta { flex: 1; min-width: 0; }
.alert-lbl  { font-size: clamp(8px,1.1vh,11px); font-weight: 400; color: var(--c2); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 2px; }
.alert-name { font-size: clamp(12px,2vh,18px); font-weight: 700; color: var(--c1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .3s; }
.alert-name.red   { color: var(--red); }
.alert-name.amber { color: var(--amber); }

.alert-dist { text-align: right; flex-shrink: 0; }
.dist-num  { font-size: clamp(20px,4vh,36px); font-weight: 700; color: var(--c1); letter-spacing: -.02em; line-height: 1; }
.dist-unit { font-size: clamp(8px,1.1vh,11px); font-weight: 400; color: var(--c2); }

.alert-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 1px; background: var(--border); border-top: 1px solid var(--border); flex-shrink: 0;
}
.stat   { background: var(--white); padding: 5px 10px; }
.stat-l { font-size: clamp(7px,1vh,10px); font-weight: 400; color: var(--c2); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 2px; }
.stat-v { font-size: clamp(11px,1.8vh,16px); font-weight: 700; color: var(--c1); }

/* ETC */
.etc-card { flex-direction: row; align-items: center; justify-content: space-between; padding: 0 14px; }
.etc-lbl      { font-size: clamp(8px,1.1vh,11px); font-weight: 400; color: var(--c2); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 4px; }
.etc-row      { display: flex; align-items: center; gap: 14px; }
.etc-item-lbl { font-size: clamp(8px,1.1vh,11px); font-weight: 400; color: var(--c2); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 1px; }
.etc-val      { font-size: clamp(20px,3.8vh,34px); font-weight: 700; color: var(--c1); letter-spacing: -.02em; line-height: 1; }
.etc-unit     { font-size: clamp(8px,1.1vh,11px); font-weight: 400; color: var(--c2); }
.etc-sep      { width: 1px; height: 28px; background: var(--border); }
.reset-btn {
  border: 1px solid var(--border); border-radius: 7px; background: var(--surface);
  padding: 7px 14px; font-size: clamp(8px,1.2vh,11px); font-weight: 400;
  color: var(--c2); letter-spacing: .07em; cursor: pointer; text-transform: uppercase;
}
.reset-btn:active { background: var(--border); }
</style>
</head>

const ETC_RATE = 1.3;
const S = {
  speed:0, gps:false, lat:25.046, lng:121.537,
  wasOver:false, lb:0, lcb:0, km:0, llat:null, llng:null,
  section:null, sectionEntryTime:null, sectionEntryKm:0,
};

let AC=null;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function beepOver(){
  const c=ac();[0,.2].forEach(d=>{
    const o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type='sine';
    o.frequency.setValueAtTime(900,c.currentTime+d);
    o.frequency.exponentialRampToValueAtTime(650,c.currentTime+d+.14);
    g.gain.setValueAtTime(.001,c.currentTime+d);
    g.gain.exponentialRampToValueAtTime(.45,c.currentTime+d+.01);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.14);
    o.start(c.currentTime+d);o.stop(c.currentTime+d+.15);
  });
}
function beepCam(dist){
  const c=ac(),freq=dist<100?1400:dist<300?1100:800;
  const o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);o.type='sine';
  o.frequency.setValueAtTime(freq,c.currentTime);
  g.gain.setValueAtTime(.001,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.3,c.currentTime+.01);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);
  o.start(c.currentTime);o.stop(c.currentTime+.22);
}
['touchstart','click'].forEach(e=>document.addEventListener(e,()=>{try{ac();}catch(x){}},{once:true}));

function tick(){
  const n=new Date(),days=['週日','週一','週二','週三','週四','週五','週六'];
  const ds=`${n.getMonth()+1}月${n.getDate()}日 ${days[n.getDay()]}`;
  const ts=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  ['lsDate','ptDate'].forEach(id=>document.getElementById(id).textContent=ds);
  ['lsTime','ptTime'].forEach(id=>document.getElementById(id).textContent=ts);
}
tick();setInterval(tick,1000);

function hav(a,b,c,d){
  const R=6371000,r=Math.PI/180;
  const x=Math.sin(((c-a)*r)/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(((d-b)*r)/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function setSpdUI(spd,over,limit,rfId,glowId,numId,signId){
  const circ=2*Math.PI*88;
  const rf=document.getElementById(rfId);
  rf.style.strokeDasharray=circ;
  rf.style.strokeDashoffset=circ-circ*Math.min(spd/140,1);
  rf.style.stroke=over?'#e5251a':'#12a150';
  document.getElementById(glowId).className='glow'+(over?' on':'');
  const n=document.getElementById(numId);
  n.textContent=spd;
  n.className='spd-num'+(spd>=100?' d3':'')+(over?' red':'');
  document.getElementById(signId).textContent=limit;
}

function setAlertUI(near,over,sectionAvg,statusStr,cId,iId,nId,dId,uId,tId,lId,sId){
  const card=document.getElementById(cId),ico=document.getElementById(iId),
        nm=document.getElementById(nId),dist=document.getElementById(dId),
        unit=document.getElementById(uId);
  if(near&&near.dist<2000){
    const d=Math.round(near.dist),close=d<300,warn=d<800;
    card.className='card alert-card'+(close?' close':warn?' near':'');
    ico.className='alert-ico'+(close?' red':warn?' amber':'');
    nm.className='alert-name'+(close?' red':warn?' amber':'');
    nm.textContent=near.name;
    dist.textContent=d<1000?d:(near.dist/1000).toFixed(1);
    unit.textContent=d<1000?'公尺':'公里';
    document.getElementById(tId).textContent=near.typeLabel;
    document.getElementById(lId).textContent=near.limit+' km';
    document.getElementById(sId).textContent=statusStr;
  }else{
    card.className='card alert-card';ico.className='alert-ico';nm.className='alert-name';
    nm.textContent='路況正常';dist.textContent='--';unit.textContent='公尺';
    document.getElementById(tId).textContent='—';
    document.getElementById(lId).textContent='—';
    document.getElementById(sId).textContent='—';
  }
}

function render(){
  const spd=Math.max(0,Math.round(S.speed)),now=Date.now();
  const baseLimit=spd>=70?110:50;
  const sorted=CAMS.map(c=>({...c,dist:hav(S.lat,S.lng,c.lat,c.lng)})).sort((a,b)=>a.dist-b.dist);
  const near=sorted[0];
  const limit=near&&near.dist<3000?near.limit:baseLimit;

  // ── SECTION SPEED LOGIC ──
  let sectionAvgSpd = null;
  let sectionOver = false;

  if(near && near.type==='section'){
    // Enter section zone (within 100m of start point)
    if(near.dist < 100 && !S.section){
      S.section = near;
      S.sectionEntryTime = now;
      S.sectionEntryKm = S.km;
    }
  }

  if(S.section){
    const elapsedHours = (now - S.sectionEntryTime) / 3600000;
    const travelledKm = S.km - S.sectionEntryKm;
    if(elapsedHours > 0) sectionAvgSpd = Math.round(travelledKm / elapsedHours);

    // Exit section: travelled > sectionLen or far from cam
    const stillInSection = near && near.name === S.section.name && near.dist < S.section.sectionLen * 1000 + 500;
    if(!stillInSection){
      S.section = null;
      S.sectionEntryTime = null;
    } else {
      sectionOver = sectionAvgSpd !== null && sectionAvgSpd > S.section.limit * 1.1;
    }
  }

  const over = sectionOver || spd > limit * 1.1;

  setSpdUI(spd,over,limit,'lsRf','lsGlow','lsNum','lsSign');
  setSpdUI(spd,over,limit,'ptRf','ptGlow','ptNum','ptSign');

  // Build status string
  const statusStr = sectionOver
    ? `⚠ 區間 ${sectionAvgSpd}km/h`
    : over ? '⚠ 超速'
    : S.section ? `區間 ${sectionAvgSpd??'--'}km/h`
    : near&&near.dist<300 ? '⚠ 注意' : '正常';

  setAlertUI(near,over,sectionAvgSpd,statusStr,'lsCard','lsIco','lsName','lsDist','lsUnit','lsST','lsSL','lsSS');
  setAlertUI(near,over,sectionAvgSpd,statusStr,'ptCard','ptIco','ptName','ptDist','ptUnit','ptST','ptSL','ptSS');

  const app=document.getElementById('app');
  near&&near.dist<100?app.classList.add('flash-border'):app.classList.remove('flash-border');

  if(over&&!S.wasOver){beepOver();S.lb=now;}
  else if(over&&now-S.lb>4000){beepOver();S.lb=now;}
  S.wasOver=over;
  if(near&&near.dist<800&&now-S.lcb>5000){beepCam(Math.round(near.dist));S.lcb=now;}

  if(S.llat!==null&&spd>5){const dm=hav(S.lat,S.lng,S.llat,S.llng);if(dm<500)S.km+=dm/1000;}
  S.llat=S.lat;S.llng=S.lng;
  const km=S.km.toFixed(1),fee=Math.round(S.km*ETC_RATE);
  ['lsKm','ptKm'].forEach(id=>document.getElementById(id).textContent=km);
  ['lsFee','ptFee'].forEach(id=>document.getElementById(id).textContent=fee);
}

function resetETC(){
  S.km=0;S.llat=null;S.llng=null;
  ['lsKm','ptKm'].forEach(id=>document.getElementById(id).textContent='0.0');
  ['lsFee','ptFee'].forEach(id=>document.getElementById(id).textContent='0');
}
document.getElementById('lsReset').addEventListener('click',resetETC);

function initGPS(){
  if(!navigator.geolocation){demo();return;}
  document.getElementById('gpsDot').classList.add('s');
  const w=navigator.geolocation.watchPosition(p=>{
    S.gps=true;S.lat=p.coords.latitude;S.lng=p.coords.longitude;
    S.speed=(p.coords.speed||0)*3.6;
    document.getElementById('gpsDot').classList.remove('s');
    document.getElementById('gpsLbl').textContent='GPS';
    render();
  },()=>demo(),{enableHighAccuracy:true,maximumAge:1000});
  setTimeout(()=>{if(!S.gps){navigator.geolocation.clearWatch(w);demo();}},4000);
}

function demo(){
  S.gps=true;
  document.getElementById('gpsDot').classList.remove('s');
  document.getElementById('gpsLbl').textContent='DEMO';
  let t=0;
  setInterval(()=>{
    t+=.025;
    S.speed=88+Math.sin(t)*30+Math.sin(t*1.7)*10;
    S.lat=25.046+Math.sin(t*.18)*.005;
    S.lng=121.537+Math.cos(t*.12)*.005;
    render();
  },250);
}

// ── ORIENTATION AUTO-DETECT ──
function applyOrientation() {
  const app = document.getElementById('app');
  const isPortrait = window.innerHeight > window.innerWidth;
  app.classList.toggle('is-portrait',  isPortrait);
  app.classList.toggle('is-landscape', !isPortrait);
}
applyOrientation();
window.addEventListener('resize', applyOrientation);
screen.orientation && screen.orientation.addEventListener('change', applyOrientation);
window.addEventListener('orientationchange', applyOrientation);

// ── 啟動 ──
initGPS();
</script>
